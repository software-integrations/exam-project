# Port of the GraphQL API. Endpoint: POST http://localhost:8083/graphql
server.port=8083

# GraphiQL: a browser page for trying queries at http://localhost:8083/graphiql
spring.graphql.graphiql.enabled=true

# H2 console: a database admin page at http://localhost:8083/h2-console
# Use it to look inside the shards and the warehouse, for example with
# JDBC URL jdbc:h2:file:./data/warehouse;AUTO_SERVER=TRUE (user "sa", empty password).
spring.h2.console.enabled=true
