# Port of the SOAP API
server.port=8082

# All SOAP endpoints live under /services (CXF default)
cxf.path=/services

# H2 database stored in a file. AUTO_SERVER lets a database tool connect while the API runs.
spring.datasource.url=jdbc:h2:file:./data/soap;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Run schema.sql and data.sql on every start (the data is reset each time)
spring.sql.init.mode=always
