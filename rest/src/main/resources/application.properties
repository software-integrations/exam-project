# Port of the REST API
server.port=8081

# H2 database stored in a file. AUTO_SERVER lets a database tool connect while the API runs.
spring.datasource.url=jdbc:h2:file:./data/rest;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Run schema.sql and data.sql on every start (the data is reset each time)
spring.sql.init.mode=always

# Redis (key-value store for revoked tokens)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT settings. The secret signs the tokens and must be at least 32 characters.
jwt.secret=${JWT_SECRET:local-development-secret-change-me-1234567890}
jwt.ttl-minutes=15

# Return errors in the standard "problem details" JSON format (RFC 9457)
spring.mvc.problemdetails.enabled=true
